plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigningValues = [
    storeFile: providers.gradleProperty('ANDROID_RELEASE_STORE_FILE')
        .orElse(providers.environmentVariable('ANDROID_RELEASE_STORE_FILE')).orNull,
    storePassword: providers.gradleProperty('ANDROID_RELEASE_STORE_PASSWORD')
        .orElse(providers.environmentVariable('ANDROID_RELEASE_STORE_PASSWORD')).orNull,
    keyAlias: providers.gradleProperty('ANDROID_RELEASE_KEY_ALIAS')
        .orElse(providers.environmentVariable('ANDROID_RELEASE_KEY_ALIAS')).orNull,
    keyPassword: providers.gradleProperty('ANDROID_RELEASE_KEY_PASSWORD')
        .orElse(providers.environmentVariable('ANDROID_RELEASE_KEY_PASSWORD')).orNull,
]
def hasAnyReleaseSigningValue = releaseSigningValues.values().any { it }
def hasCompleteReleaseSigning = releaseSigningValues.values().every { it }
if (hasAnyReleaseSigningValue && !hasCompleteReleaseSigning) {
    throw new GradleException('Android release signing requires STORE_FILE, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD.')
}

android {
    namespace 'com.kogateway.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kogateway.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Универсальная сборка: один APK на все ABI + отдельные split-APK
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    signingConfigs {
        if (hasCompleteReleaseSigning) {
            release {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasCompleteReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
