services:
  wdtt-bot:
    build: .
    container_name: wdtt-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      # база SQLite живёт в named-томе и переживает пересоздание контейнера
      - bot-data:/app/data
    # Порт нужен ТОЛЬКО если WEBHOOK_ENABLED=true (webhook ЮKassa).
    # Если webhook не используется — раскомментируйте и укажите порт наружу:
    # ports:
    #   - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"

volumes:
  bot-data:
