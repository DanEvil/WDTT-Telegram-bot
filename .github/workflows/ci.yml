name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Syntax check (all modules)
        run: python -m py_compile api.py bot.py db.py config.py wdtt.py server_setup.py web_app.py webapp.py plans.py payments.py metrics.py webhook.py
      - name: Run tests
        run: |
          pytest -q --cov=. --cov-report=term-missing
      - name: Smoke test (integration)
        run: python smoke_test.py
      - name: Build Docker image
        run: docker build -t wdtt-bot:latest .
