services:
  wdtt-bot:
    build: .
    container_name: wdtt-bot
    restart: unless-stopped
    # Сеть хоста: не создаём собственный bridge — на VPS, где рядом работают
    # VPN-туннели/панель WDTT, новая docker-сеть может конфликтовать с их
    # маршрутами и ронять трафик.
    network_mode: host
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      # база SQLite живёт в named-томе и переживает пересоздание контейнера
      - bot-data:/app/data

# Порт нужен ТОЛЬКО если WEBHOOK_ENABLED=true (webhook ЮKassa).
# В network_mode: host секция ports не используется: контейнер сам слушает
# WEBHOOK_PORT на хосте — убедитесь, что этот порт свободен.

volumes:
  bot-data:
