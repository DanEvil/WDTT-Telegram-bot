# nginx-фронтенд для VLESS XHTTP-инбаунда (vless-xhttp-in, 78.17.16.23:20500).
# Вариант «прямой домен на VPN-ноду»: домен должен быть в белом списке РФ
# и резолвиться на 78.17.16.23. Тогда XHTTP трафик — это обычный HTTPS к
# whitelisted-домену, а uplink-данные идут в HTTP-заголовках (X-Data-N),
# поэтому буферы заголовков увеличены.
#
# Установка: положить в /etc/nginx/sites-enabled/xhttp.conf (или
# /etc/nginx/conf.d/), certbot --nginx -d <домен>, nginx -t && systemctl reload nginx.

server {
    listen 80;
    server_name xhttp.example.ru;  # <-- ваш whitelisted-домен на 78.17.16.23
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xhttp.example.ru;

    ssl_certificate     /etc/letsencrypt/live/xhttp.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xhttp.example.ru/privkey.pem;

    # XHTTP кладёт uplink в заголовки X-Data-N — нужны большие буферы.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    location /xhttp {
        proxy_pass http://127.0.0.1:20500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # XHTTP держит download-сессии открытыми надолго.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
    }
}
